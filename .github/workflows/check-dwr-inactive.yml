name: DWR Inactive Stations Check & R2 Sync

on:
  # 1. Scheduled Check (Daily at 02:00 UTC / 09:00 Bangkok time)
  schedule:
    - cron: "0 2 * * *"

  # 2. Manual Trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  check-inactive:
    name: Scan Inactive DWR Stations (> 5 Days)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: "Asia/Bangkok"

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Bun Environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Step 4: Run Inactive Stations Scan & R2 Upload
      - name: Execute DWR Inactive Scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'flood-analysis-project' }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || 'https://pub-6d09ad692430411182c45170ee192a0a.r2.dev' }}
          R2_CUSTOM_ENDPOINT: ${{ secrets.R2_CUSTOM_ENDPOINT || 'https://c1cb1f0a6c635934ed103363ac3222c0.r2.cloudflarestorage.com' }}
          R2_LOCAL_FALLBACK: "false"
        run: |
          echo "🔍 Scanning DWR stations across all 63 provinces for inactive sensors (> 5 days)..."
          bun run check:dwr-inactive
